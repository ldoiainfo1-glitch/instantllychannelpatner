<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>My Vouchers - Instantlly Channel Partner</title>
    <link rel="icon" href="images/logo.jpeg" type="image/jpeg">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            padding-top: 70px;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        .vouchers-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
            margin-bottom: 2rem;
        }

        .stat-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            overflow: hidden;
            background: white;
            margin-bottom: 1.5rem;
            border-left: 4px solid;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .stat-card.total { border-left-color: #3b82f6; }
        .stat-card.purchased { border-left-color: #10b981; }
        .stat-card.received { border-left-color: #06b6d4; }
        .stat-card.sent { border-left-color: #f59e0b; }

        .stat-card .card-body {
            padding: 1.5rem;
        }

        .stat-icon {
            font-size: 2.5rem;
            opacity: 0.2;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #6b7280;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #111827;
        }

        .voucher-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            overflow: hidden;
            background: white;
            margin-bottom: 1.5rem;
        }

        .voucher-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .voucher-header-section {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .voucher-header-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-10%, -10%); }
        }

        .voucher-number {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            position: relative;
            z-index: 1;
        }

        .voucher-status-badge {
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .status-active { background: #d1fae5; color: #065f46; }
        .status-redeemed { background: #e5e7eb; color: #374151; }
        .status-expired { background: #fee2e2; color: #991b1b; }

        .voucher-body {
            padding: 1.5rem;
        }

        .voucher-amount {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }

        .voucher-detail-label {
            font-size: 0.75rem;
            color: #6b7280;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .voucher-detail-value {
            font-size: 1rem;
            font-weight: 600;
            color: #111827;
        }

        .nav-tabs {
            border-bottom: 2px solid #e5e7eb;
            background: white;
            border-radius: 12px 12px 0 0;
            padding: 0 1rem;
        }

        .nav-tabs .nav-link {
            border: none;
            padding: 1rem 1.5rem;
            font-weight: 500;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .nav-tabs .nav-link:hover {
            color: #3b82f6;
            border-bottom-color: #e5e7eb;
        }

        .nav-tabs .nav-link.active {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-state-icon {
            font-size: 4rem;
            color: #d1d5db;
            margin-bottom: 1rem;
        }

        .empty-state-text {
            font-size: 1.125rem;
            color: #6b7280;
        }

        .btn-transfer {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            border: none;
            color: white;
            font-weight: 600;
        }

        .btn-transfer:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
            color: white;
        }

        .transfer-history-item {
            padding: 1rem;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .transfer-arrow {
            color: #3b82f6;
            font-weight: 600;
            margin: 0 0.5rem;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/logo.jpeg" alt="Instantlly Logo" height="40" class="me-2" style="border-radius: 8px;">
                <div>
                    <div style="font-weight: 700; color: #111827; font-size: 1.25rem;">Vouchers</div>
                    <div style="font-size: 0.75rem; color: #6b7280;">My Vouchers Dashboard</div>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" style="color: #374151;">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html" style="color: #374151;">
                            <i class="fas fa-user-circle me-1"></i>Profile
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="vouchers.html" style="color: #3b82f6;">
                            <i class="fas fa-ticket-alt me-1"></i>Vouchers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="goToPromotions(); return false;" style="color: #374151;">
                            <i class="fas fa-bullhorn me-1"></i>Promotions
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-danger btn-sm ms-2" onclick="logout()" style="color: white;">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid" style="max-width: 1400px;">
        <!-- Header -->
        <div class="vouchers-header">
            <div class="container">
                <h1 class="mb-2">
                    <i class="fas fa-ticket-alt me-2"></i>My Vouchers
                </h1>
                <p class="mb-0" style="opacity: 0.9;">Manage and transfer your vouchers</p>
            </div>
        </div>

        <!-- Statistics -->
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="stat-card total">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="stat-label">Total Vouchers</div>
                                    <div class="stat-value" id="totalVouchersCount">0</div>
                                </div>
                                <div class="stat-icon">
                                    <i class="fas fa-ticket-alt" style="color: #3b82f6;"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card purchased">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="stat-label">Purchased</div>
                                    <div class="stat-value" id="purchasedCount">0</div>
                                </div>
                                <div class="stat-icon">
                                    <i class="fas fa-shopping-cart" style="color: #10b981;"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card received">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="stat-label">Received</div>
                                    <div class="stat-value" id="receivedCount">0</div>
                                </div>
                                <div class="stat-icon">
                                    <i class="fas fa-gift" style="color: #06b6d4;"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="stat-card sent">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="stat-label">Sent</div>
                                    <div class="stat-value" id="sentCount">0</div>
                                </div>
                                <div class="stat-icon">
                                    <i class="fas fa-paper-plane" style="color: #f59e0b;"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vouchers Card -->
            <div class="card" style="border: none; border-radius: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
                <div class="card-header bg-white" style="border-bottom: 2px solid #f3f4f6; padding: 1.5rem;">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" style="font-weight: 600; color: #111827;">
                            <i class="fas fa-list me-2"></i>Vouchers List
                        </h5>
                        <button class="btn btn-primary btn-sm" id="refreshVouchersBtn">
                            <i class="fas fa-sync-alt me-1"></i>Refresh
                        </button>
                    </div>
                </div>

                <!-- Tabs -->
                <ul class="nav nav-tabs" id="voucherTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="all-tab" data-bs-toggle="tab" data-bs-target="#all-content" type="button">
                            <i class="fas fa-list me-1"></i>All
                            <span class="badge bg-secondary ms-1" id="allBadge">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="purchased-tab" data-bs-toggle="tab" data-bs-target="#purchased-content" type="button">
                            <i class="fas fa-shopping-cart me-1"></i>Purchased
                            <span class="badge bg-success ms-1" id="purchasedBadge">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="received-tab" data-bs-toggle="tab" data-bs-target="#received-content" type="button">
                            <i class="fas fa-gift me-1"></i>Received
                            <span class="badge bg-info ms-1" id="receivedBadge">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="sent-tab" data-bs-toggle="tab" data-bs-target="#sent-content" type="button">
                            <i class="fas fa-paper-plane me-1"></i>Sent
                            <span class="badge bg-warning ms-1" id="sentBadge">0</span>
                        </button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content p-4" id="voucherTabContent">
                    <div class="tab-pane fade show active" id="all-content">
                        <div id="allVouchersList"></div>
                    </div>
                    <div class="tab-pane fade" id="purchased-content">
                        <div id="purchasedVouchersList"></div>
                    </div>
                    <div class="tab-pane fade" id="received-content">
                        <div id="receivedVouchersList"></div>
                    </div>
                    <div class="tab-pane fade" id="sent-content">
                        <div id="sentVouchersList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Transfer Modal -->
    <div class="modal fade" id="transferModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="border: none; border-radius: 16px;">
                <div class="modal-header" style="border-bottom: 2px solid #f3f4f6;">
                    <h5 class="modal-title">
                        <i class="fas fa-exchange-alt me-2" style="color: #3b82f6;"></i>
                        Transfer Voucher
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Voucher Number</label>
                        <input type="text" class="form-control" id="transferVoucherNumber" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Recipient Phone Number *</label>
                        <input type="tel" class="form-control" id="recipientPhone" placeholder="+91XXXXXXXXXX" required>
                        <small class="text-muted">Enter the phone number of the recipient</small>
                    </div>
                    <div id="transferError" class="alert alert-danger d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirmTransferBtn">
                        <i class="fas fa-paper-plane me-1"></i>Transfer Voucher
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Voucher Detail Modal -->
    <div class="modal fade" id="voucherDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="border: none; border-radius: 16px;">
                <div class="modal-header" style="border-bottom: 2px solid #f3f4f6;">
                    <h5 class="modal-title">
                        <i class="fas fa-ticket-alt me-2" style="color: #3b82f6;"></i>
                        Voucher Details
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="voucherDetailContent"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Voucher JS -->
    <script src="js/vouchers.js"></script>
</body>
</html>
